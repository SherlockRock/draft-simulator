<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tier B review</title>
<style>
/* Tokens and layout follow the 2026-10-04 recalibration page; system fonts only, so it works offline. */
:root{
  --bg:#eef1f4; --panel:#ffffff; --panel2:#e6ebf0; --fg:#14202b; --muted:#5b6b7a; --line:#cbd5de;
  --blue:#0a7c8c; --blue-soft:#d3eef1; --red:#c2412d; --red-soft:#f8ddd7;
  --gold:#a06b00; --gold-soft:#f6e6bf; --good:#1c7a45; --good-soft:#d6efe0; --need:#b45309; --need-soft:#fdebd0;
  --font-display:"Arial Narrow","Segoe UI",system-ui,sans-serif; --font-body:system-ui,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1319; --panel:#151d26; --panel2:#1c2732; --fg:#e6edf3; --muted:#8fa1b2; --line:#2b3947;
  --blue:#3cc4d6; --blue-soft:#123a42; --red:#ff7a63; --red-soft:#43201b;
  --gold:#e8b445; --gold-soft:#3d2f0e; --good:#4fcf85; --good-soft:#12341f; --need:#f5a94a; --need-soft:#3d2a10; color-scheme:dark}}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:14px;line-height:1.4;margin:0;padding-inline:16px;padding-block:0 40px}
.wrap{max-width:1240px;margin-inline:auto}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);padding-block:10px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
h1{font-family:var(--font-display);font-size:24px;margin:0;letter-spacing:.02em;text-transform:uppercase;line-height:1.1}
.sub{color:var(--muted);font-size:12px;margin:2px 0 0}
.bar{display:flex;gap:10px 14px;align-items:center;flex-wrap:wrap}
.count{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:600}
.notice{background:var(--need-soft);color:var(--need);border:1px solid var(--need);border-radius:6px;padding:4px 8px;font-size:12px;font-weight:600}
button{font:inherit;cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.55}
button:focus-visible,input:focus-visible,.o:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.btn{background:var(--fg);color:var(--bg);border:0;border-radius:6px;padding:7px 14px;font-weight:600}
.btn.ghost{background:var(--panel2);color:var(--fg);border:1px solid var(--line)}
.filter{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:13px}
section.draft{margin-top:26px}
.dhead{display:flex;flex-wrap:wrap;gap:4px 16px;align-items:baseline;justify-content:space-between;border-bottom:2px solid var(--line);padding-bottom:4px}
.dhead h2{font-family:var(--font-display);font-size:28px;text-transform:uppercase;letter-spacing:.04em;margin:0}
.dprog{color:var(--muted);font-variant-numeric:tabular-nums;font-weight:600}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:14px;margin-top:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card.blue{border-top:4px solid var(--blue)}.card.red{border-top:4px solid var(--red)}
.card.done{opacity:.8}
.card[hidden]{display:none}
.chead{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;justify-content:space-between}
.chead h3{margin:0;font-family:var(--font-display);font-size:20px;letter-spacing:.02em;overflow-wrap:anywhere}
.mover{font-weight:600;font-size:13px;padding:3px 9px;border-radius:99px}
.mover.blue{background:var(--blue-soft);color:var(--blue)}.mover.red{background:var(--red-soft);color:var(--red)}
.lbl{font-family:var(--font-display);text-transform:uppercase;letter-spacing:.08em;font-size:13px;color:var(--muted);margin:0 0 5px;font-weight:700}
.side{display:flex;flex-wrap:wrap;gap:3px 8px;align-items:flex-start;padding:4px 6px;border-radius:6px}
.side.blue{background:var(--blue-soft)}.side.red{background:var(--red-soft)}
.side .who{font-family:var(--font-display);font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.06em;width:100%}
.side.blue .who{color:var(--blue)}.side.red .who{color:var(--red)}
.boards{display:flex;flex-direction:column;gap:4px}
.row{display:flex;flex-wrap:wrap;gap:3px;align-items:flex-start;min-width:0}
.sep{width:1px;align-self:stretch;background:var(--muted);opacity:.5;margin-inline:3px}
.tile{width:42px;display:flex;flex-direction:column;align-items:center;gap:1px;text-align:center}
.tile .nm{font-size:9px;line-height:1.05;overflow-wrap:anywhere}
.ic{display:block;width:30px;height:30px;border-radius:5px;object-fit:cover;background:var(--panel2)}
.init{display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--muted);border:1px dashed var(--muted);font-size:12px}
.tile.ban .ic{filter:grayscale(1) brightness(.75);opacity:.7}
.tile.ban .nm{text-decoration:line-through;color:var(--muted)}
.role{display:grid;grid-template-columns:62px 1fr;gap:6px;padding:5px 6px;border-radius:6px;background:var(--need-soft);outline:2px solid var(--need);align-items:start;margin-bottom:4px}
.role .rn{font-family:var(--font-display);text-transform:uppercase;font-weight:700;letter-spacing:.06em;font-size:14px;padding-top:5px;color:var(--need)}
.chips{display:flex;flex-wrap:wrap;gap:5px;min-width:0}
.chip{display:flex;align-items:center;gap:5px;border-radius:6px;padding:2px 7px 2px 2px;border:1px solid var(--line);background:var(--panel);font-size:12px;font-weight:600;line-height:1.1;min-width:0}
.chip .ic,.chip .init{width:24px;height:24px;border-radius:4px}
.chip.av{border-color:var(--good)}.chip.av .st{color:var(--good)}
.chip.bn{opacity:.55;background:var(--panel2);text-decoration:line-through;color:var(--muted)}
.chip.bn .ic{filter:grayscale(1)}
.chip.us{background:var(--gold-soft);border-color:var(--gold);color:var(--gold);border-style:dashed}
.chip.th{background:var(--panel2);border-color:var(--muted);border-style:dotted;color:var(--muted)}
.chip .st{font-size:9px;font-weight:700;letter-spacing:.06em;text-decoration:none}
.stage{border-top:1px solid var(--line);padding-top:10px}
.pickrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pickrow input[type=text]{background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:7px 9px;font:inherit;min-width:0;flex:1 1 140px}
.pickrow input.bad{border-color:var(--red)}
.perr{color:var(--red);font-size:12px;margin-top:4px;min-height:1em}
.locked{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.locked b{font-size:15px}
.note{font-size:12px;color:var(--muted)}
.opts{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.o{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:6px 8px;border-bottom:1px solid var(--line)}
.o:last-child{border-bottom:0}
.o.labelled{background:var(--panel2)}
.o .who2{display:flex;flex-wrap:wrap;gap:6px;min-width:0;align-items:center}
.o .ics{display:flex;gap:3px}
.o .words{font-size:13px;font-weight:600;min-width:0;overflow-wrap:anywhere}
.tag{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;border-radius:3px;padding:1px 4px;line-height:1.2;display:inline-block;margin-left:6px;vertical-align:1px}
.tag.in{background:var(--good-soft);color:var(--good);border:1px solid var(--good)}
.tag.off{background:var(--need-soft);color:var(--need);border:1px solid var(--need)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{background:var(--panel2);color:var(--fg);border:0;padding:7px 12px;font-weight:600;min-width:58px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.seg button .k{font-size:10px;opacity:.6;margin-right:4px}
@media(max-width:460px){.o{grid-template-columns:minmax(0,1fr)}}
.dfoot{margin-top:12px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:flex-end;color:var(--muted)}
.armsel{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:13px}
.armsel[hidden]{display:none}
.armsel select{font:inherit;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:4px 6px}
#export-box{display:block;width:100%;min-height:120px;margin-top:8px;font:12px/1.3 ui-monospace,Consolas,monospace;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:6px}
#export-box[hidden]{display:none}
.o .meta{grid-column:1/-1;font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 12px}
.o .meta b{color:var(--fg)}
.o.rv{border-left:4px solid transparent}
.o.near{border-left-color:var(--gold);background:var(--gold-soft)}
.o.ro{background:var(--panel2);opacity:.9}
.bdg{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;border-radius:3px;padding:1px 4px;line-height:1.2;display:inline-block;margin-left:6px;vertical-align:1px;border:1px solid var(--muted);color:var(--muted)}
.bdg.tie{border-color:var(--gold);color:var(--gold);background:var(--gold-soft)}
.bdg.bip{border-color:var(--good);color:var(--good)}
.bdg.late{border-color:var(--blue);color:var(--blue)}
.facts{display:flex;flex-direction:column;gap:3px;font-size:13px;margin:6px 0}
.facts .warn{background:var(--need-soft);color:var(--need);border:1px solid var(--need);border-radius:6px;padding:4px 8px}
details.more{margin-top:8px;font-size:13px}
details.more summary{cursor:pointer;font-weight:600}
details.more table{border-collapse:collapse;margin-top:4px;font-variant-numeric:tabular-nums}
details.more td,details.more th{padding:2px 8px;text-align:left;border-bottom:1px solid var(--line)}
.lineverdict{border:1px solid var(--line);border-radius:8px;padding:8px;margin-top:8px;display:flex;flex-direction:column;gap:4px}
.cardnote{width:100%;min-height:48px;margin-top:6px;font:inherit;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:6px}

/* The results tab. Sequential heat: one hue (palette blue), four steps; the printed number carries the value. */
:root{--heat0:#cde2fb;--heat1:#9ec5f4;--heat2:#6da7ec;--heat3:#3987e5;--heat-ink:#14202b}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--heat0:#0d366b;--heat1:#184f95;--heat2:#256abf;--heat3:#3987e5;--heat-ink:#ffffff}}
:root[data-theme="dark"]{--heat0:#0d366b;--heat1:#184f95;--heat2:#256abf;--heat3:#3987e5;--heat-ink:#ffffff}
.tabs{display:flex;gap:4px;margin-top:10px;border-bottom:1px solid var(--line)}
.tabs button{background:transparent;color:var(--muted);border:0;border-bottom:3px solid transparent;padding:6px 14px;font-weight:700;font-family:var(--font-display);text-transform:uppercase;letter-spacing:.06em;font-size:15px}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--fg)}
#results{margin-top:18px;display:flex;flex-direction:column;gap:18px}
#results[hidden]{display:none}
#results h2{font-family:var(--font-display);font-size:22px;text-transform:uppercase;letter-spacing:.04em;margin:0 0 6px}
.rsec{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;min-width:0}
.rsec p{margin:4px 0}
.rsec .ln{margin:3px 0;overflow-wrap:anywhere}
.rside{display:flex;flex-wrap:wrap;gap:18px 28px;align-items:flex-start}
table.heat{border-collapse:separate;border-spacing:4px}
table.heat th{font-weight:600;color:var(--muted);font-size:12px;text-align:center;padding:2px 4px;font-variant-numeric:tabular-nums}
table.heat th[scope="row"]{text-align:right;white-space:nowrap}
.hc{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-width:104px;min-height:68px;padding:6px 6px;border:1px solid var(--line);border-radius:6px;color:var(--heat-ink);background:var(--heat0);font:inherit;cursor:pointer;text-align:center}
.hc.h1{background:var(--heat1)}.hc.h2{background:var(--heat2)}.hc.h3{background:var(--heat3)}
.hc .n{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.hc .tg{display:flex;flex-wrap:wrap;gap:2px;justify-content:center}
.hc .tg span{font-size:11px;font-weight:700;line-height:1.2;background:var(--panel);color:var(--fg);border:1px solid var(--fg);border-radius:3px;padding:0 4px}
.hc:hover,.hc:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.hc[aria-pressed="true"]{box-shadow:0 0 0 3px var(--fg)}
.hc.static{cursor:default}
.hscroll{overflow-x:auto;max-width:100%}.detail{font-size:13px}.detail .ln{margin:2px 0;overflow-wrap:anywhere}.detail .ln:first-child{font-weight:700}
.heatkey{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted);margin-top:6px}
.heatkey i{display:inline-block;width:22px;height:12px;border:1px solid var(--line);border-radius:2px;background:var(--heat0)}.heatkey i.h1{background:var(--heat1)}.heatkey i.h2{background:var(--heat2)}.heatkey i.h3{background:var(--heat3)}
.fl{border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:13px}
.fl td,.fl th{padding:3px 8px;border-bottom:1px solid var(--line);text-align:left}
#tip{position:fixed;z-index:20;max-width:min(560px,calc(100vw - 24px));background:var(--panel);color:var(--fg);border:1px solid var(--fg);border-radius:6px;padding:8px 10px;font-size:12px;box-shadow:0 4px 14px rgba(0,0,0,.25);pointer-events:none}
#tip[hidden]{display:none}
#tip .ln{margin:2px 0;overflow-wrap:anywhere}#tip .ln:first-child{font-weight:700;font-size:13px}
.rtable{border-collapse:collapse;font-variant-numeric:tabular-nums}
.rtable td,.rtable th{padding:3px 12px 3px 0;text-align:left;border-bottom:1px solid var(--line)}
@media(max-width:560px){.hc{min-width:78px}}
</style>
</head>
<body>
<div class="wrap">
<header class="top">
  <div><h1>Tier B review</h1><p class="sub" id="runline"></p></div>
  <div class="bar">
    <span class="count" id="count-rows"></span>
    <span class="count" id="count-cards"></span>
    <label class="filter"><input type="checkbox" id="unfinished"> Unfinished cards only</label>
    <span class="notice" id="storage-notice" hidden></span>
    <span class="notice" id="load-errors" hidden></span>
    <span class="note">keys 1 2 3 = play, maybe, never</span>
    <label class="armsel" id="armwrap" hidden>arm <select id="arm"></select></label>
    <span class="note" id="export-msg"></span>
    <button class="btn" type="button" id="copy" disabled title="Nothing to export yet.">Copy verdicts</button>
    <button class="btn ghost" type="button" id="download" disabled title="Nothing to export yet.">Download</button>
  </div>
</header>
<div class="wrap"><div class="tabs" role="tablist" aria-label="Page">
  <button type="button" role="tab" id="tab-positions" aria-selected="true" aria-controls="root">Positions</button>
  <button type="button" role="tab" id="tab-results" aria-selected="false" aria-controls="results">Results</button>
</div></div>
<div class="wrap"><textarea id="export-box" readonly hidden aria-label="Verdicts export"></textarea></div>
<main id="root"></main>
<section id="results" role="tabpanel" aria-labelledby="tab-results" hidden></section>
<div id="tip" role="tooltip" hidden></div>
</div>
<script id="page-data" type="application/json">@@DATA@@</script>
<script>
/*@@LOGIC@@*/
</script>
<script>
"use strict";
const T0 = performance.now();
const DATA = JSON.parse(document.getElementById("page-data").textContent);
const NAMES = DATA.names;
const ICONS = DATA.icons;
const NAME_INDEX = buildNameIndex(NAMES);
const ROLE_ORDER = ["top", "jungle", "mid", "adc", "support"];
const KEY_LABEL = { "1": "play", "2": "maybe", "3": "never" };
const STORE_KEY = "tier-b-review/" + DATA.run.id;
const DN = (c) => dn(NAMES, c);

// ---- storage: every read and write guarded, the header says when it does not hold ----
const store = makeStorage(() => localStorage, STORE_KEY);
const state = restoreState(DATA, store.read());
function persist() {
  store.write(JSON.stringify(state));
  showNotice();
}
function showNotice() {
  const n = document.getElementById("storage-notice");
  n.hidden = store.available();
  n.textContent = store.available() ? "" : "Progress is not being saved in this browser: finish in one sitting, or it is lost on reload.";
  const e = document.getElementById("load-errors");
  const errs = DATA.load_errors;
  e.hidden = errs.length === 0;
  e.textContent = errs.length === 0 ? "" : errs.length + " fixture" + (errs.length === 1 ? "" : "s") + " failed to load and " + (errs.length === 1 ? "is" : "are") + " not on this page: " + errs.join(" | ");
}

// ---- small helpers ----
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
function icon(c) {
  if (ICONS[c]) {
    const i = el("img", "ic");
    i.src = "data:image/webp;base64," + ICONS[c];
    i.alt = DN(c);
    return i;
  }
  const d = el("div", "ic init", DN(c).slice(0, 2));
  d.title = DN(c);
  return d;
}
function tile(c, extra) {
  const t = el("div", "tile " + (extra || ""));
  t.title = DN(c);
  t.appendChild(icon(c));
  t.appendChild(el("span", "nm", DN(c)));
  return t;
}
const now = () => new Date().toISOString().replace(/\.\d+Z$/, "Z");

const CARDS = new Map();
for (const draft of DATA.drafts) for (const card of draft.cards) CARDS.set(card.id, { draft, card });

// ---- the board and the pool ----
function boardSide(card, side) {
  const w = el("div", "side " + side.toLowerCase());
  w.appendChild(el("div", "who", side + " bans | picks"));
  const r = el("div", "row");
  for (const kind of ["ban", "pick"]) {
    if (kind === "pick") r.appendChild(el("span", "sep"));
    for (const x of card.board.filter((b) => b.side === side && b.kind === kind)) {
      r.appendChild(tile(x.champion, kind === "ban" ? "ban" : ""));
    }
  }
  w.appendChild(r);
  return w;
}
const STATUS_TEXT = { av: "OPEN", bn: "BAN", us: "OURS", th: "THEIRS" };
function chipState(card, c) {
  const b = card.board.find((x) => x.champion === c);
  if (!b) return "av";
  if (b.kind === "ban") return "bn";
  return b.side === card.mover ? "us" : "th";
}
function chip(card, c) {
  const s = chipState(card, c);
  const e = el("span", "chip " + s);
  e.appendChild(icon(c));
  e.appendChild(el("span", "", DN(c)));
  e.appendChild(el("span", "st", STATUS_TEXT[s]));
  e.title = DN(c) + " - " + STATUS_TEXT[s];
  return e;
}
function poolBlock(card) {
  const wrap = el("div", "");
  const roles = ROLE_ORDER.filter((r) => card.open_roles.some((set) => set.includes(r)));
  const map = Array.isArray(card.pool) ? null : card.pool;
  wrap.appendChild(el("p", "lbl", "Your pool" + (map && roles.length ? " for the open role" + (roles.length > 1 ? "s" : "") : "")));
  if (!map) {
    const row = el("div", "role");
    row.appendChild(el("div", "rn", "pool"));
    const ch = el("div", "chips");
    for (const c of card.pool) ch.appendChild(chip(card, c));
    row.appendChild(ch);
    wrap.appendChild(row);
    return wrap;
  }
  for (const r of roles.length ? roles : ROLE_ORDER) {
    const row = el("div", "role");
    row.appendChild(el("div", "rn", r));
    const ch = el("div", "chips");
    for (const c of map[r] || []) ch.appendChild(chip(card, c));
    row.appendChild(ch);
    wrap.appendChild(row);
  }
  return wrap;
}

// ---- stage 1: the own pick, before any engine row is on screen ----
// The pick form: one input at a single root, two at a pair root, and "No view".
function pickForm(draft, card, wrap, afterReveal) {
  const n = card.kind === "pair" ? 2 : 1;
  const row = el("div", "pickrow");
  const inputs = [];
  for (let i = 0; i < n; i++) {
    const inp = el("input", "");
    inp.type = "text";
    inp.setAttribute("list", "roster");
    inp.placeholder = n === 2 ? "Champion " + (i + 1) : "Champion";
    inp.setAttribute("aria-label", "My pick" + (n === 2 ? " " + (i + 1) : "") + " on " + card.id);
    inp.autocomplete = "off";
    inputs.push(inp);
    row.appendChild(inp);
  }
  const err = el("div", "perr", "");
  const lock = el("button", "btn", afterReveal ? "Record my pick" : "Lock my pick");
  lock.type = "button";
  const submit = () => {
    const ids = inputs.map((inp) => parseNameInput(inp.value, NAME_INDEX));
    inputs.forEach((inp, i) => inp.classList.toggle("bad", ids[i] === null && inp.value.trim() !== ""));
    const problem = pickProblem(card, ids, NAMES);
    if (problem) { err.textContent = problem; return; }
    changed(() => setPick(state, draft, card.id, n === 2 ? ids : ids[0], now()), card.id);
  };
  lock.onclick = submit;
  inputs.forEach((inp) => inp.addEventListener("keydown", (ev) => { if (ev.key === "Enter") submit(); }));
  const nv = el("button", "btn ghost", "No view");
  nv.type = "button";
  nv.title = "I would not pick anything here before seeing options.";
  nv.onclick = () => changed(() => setPick(state, draft, card.id, null, now()), card.id);
  row.appendChild(lock);
  row.appendChild(nv);
  wrap.appendChild(row);
  wrap.appendChild(err);
  wrap.appendChild(el("p", "note", afterReveal
    ? "Given now, after the options were shown: it is recorded as scored, not as a blind pick."
    : "Once locked the pick cannot be changed before the reveal, and the options appear. Name it first: nothing from the engine is shown until you do."));
}

function stageOne(draft, card) {
  const ps = state.positions[card.id];
  const wrap = el("div", "stage");
  wrap.appendChild(el("p", "lbl", "1. My " + (card.kind === "ban" ? "ban" : "pick")));
  const revealed = draftShown(draft, state);
  if (pickAnswered(ps)) {
    const l = el("div", "locked");
    l.appendChild(el("b", "", pickText(ps.pick.current, NAMES)));
    const text = !revealed
      ? "locked: given before any engine option was shown"
      : ps.pick.mode === "scored"
        ? (ps.pick.blind !== undefined ? "changed after the options were shown (scored); given blind: " + pickText(ps.pick.blind, NAMES) : "given after the options were shown (scored)")
        : ps.pick.blind !== undefined ? "given blind; a change now is recorded as scored" : "given after the options were shown (scored)";
    l.appendChild(el("span", "note", text));
    wrap.appendChild(l);
    if (revealed) pickForm(draft, card, wrap, true);
    return wrap;
  }
  if (revealed) {
    wrap.appendChild(el("p", "note", "No own pick was recorded for this card. One can still be given now."));
    pickForm(draft, card, wrap, true);
    return wrap;
  }
  if (Object.keys(ps.labels).length > 0) {
    wrap.appendChild(el("p", "note", "No own pick is recorded for this card."));
    return wrap;
  }
  pickForm(draft, card, wrap, false);
  return wrap;
}

// ---- stage 2: the card's blind rows, shuffled, no scores ----
// The three-way control of a labelled row, shared by the blind rows and the revealed ones.
function segFor(draft, card, option, idx, wordsText) {
  const cur = currentLabel(state, card.id, option.id);
  const seg = el("div", "seg");
  seg.setAttribute("role", "group");
  seg.setAttribute("aria-label", "Label for " + wordsText);
  LABELS.forEach((lab, i) => {
    const b = el("button", "");
    b.type = "button";
    b.appendChild(el("span", "k", String(i + 1)));
    b.appendChild(document.createTextNode(lab));
    b.setAttribute("aria-pressed", String(cur === lab));
    b.tabIndex = -1;
    b.onclick = () => labelRow(draft, card, option, lab, idx, false);
    seg.appendChild(b);
  });
  return seg;
}
// The rows of each card that take a label, in the order they are drawn: what keys 1/2/3 and "advance" walk.
const ROWLIST = new Map();
function optionRow(draft, card, option, idx) {
  const ps = state.positions[card.id];
  const cur = currentLabel(state, card.id, option.id);
  const r = el("div", "o" + (cur ? " labelled" : ""));
  r.tabIndex = 0;
  r.dataset.card = card.id;
  r.dataset.idx = String(idx);
  const view = rowView(option, NAMES);
  const who = el("div", "who2");
  const ics = el("div", "ics");
  for (const c of view.icons) ics.appendChild(icon(c));
  who.appendChild(ics);
  const words = el("div", "words", view.text);
  if (view.tag) words.appendChild(el("span", "tag " + view.tag, view.tag === "in" ? "in pool" : "off pool"));
  who.appendChild(words);
  r.appendChild(who);
  r.appendChild(segFor(draft, card, option, idx, view.text));
  if (ps.labels[option.id] && ps.labels[option.id].via === "own-pick") r.title = "Pre-set to play: this is your own pick.";
  return r;
}
function labelRow(draft, card, option, lab, idx, advance) {
  changed(() => setLabel(state, draft, card.id, option.id, lab, now()), card.id);
  const focusAt = advance ? Math.min(idx + 1, (ROWLIST.get(card.id) || []).length - 1) : idx;
  const target = document.querySelector('.o[data-card="' + CSS.escape(card.id) + '"][data-idx="' + focusAt + '"]');
  if (target) target.focus();
}
function stageTwo(draft, card, rows) {
  ROWLIST.set(card.id, rows);
  const wrap = el("div", "stage");
  const ps = state.positions[card.id];
  const done = rows.filter((o) => ps.labels[o.id] !== undefined).length;
  wrap.appendChild(el("p", "lbl", "2. Options (shuffled, no scores) - " + done + " / " + rows.length + " labelled"));
  const box = el("div", "opts");
  rows.forEach((o, i) => box.appendChild(optionRow(draft, card, o, i)));
  wrap.appendChild(box);
  wrap.appendChild(el("p", "note", "Play: happy to pick this here (off the pool: I would leave it for this). Maybe: defensible, with a caveat. Never: in the pool, I would not pick it here; off the pool, absurd in that role or not worth leaving for. Early slots: assume competent follow-up from this pool."));
  return wrap;
}

// ---- cards, drafts, header ----
function slotText(card) {
  if (card.kind === "pair") return "pair, slots " + card.slot + "+" + (card.slot + 1);
  return (card.kind === "ban" ? "ban" : "single pick") + ", slot " + card.slot;
}
// ---- stage 3: the reveal, per draft and one way ----
let viewArm = referenceArmIndex(DATA);
const f2 = (x) => (x === null || x === undefined ? "n/a" : x.toFixed(2));
const f3 = (x) => (x === null || x === undefined ? "n/a" : x.toFixed(3));
const f4 = (x) => (x === null || x === undefined ? "n/a" : x.toFixed(4));

function fact(text, cls) {
  return el("div", cls || "", text);
}
function badge(text, cls) {
  return el("span", "bdg " + cls, text);
}

function ownPickFacts(card, ps) {
  const out = [];
  if (!pickAnswered(ps)) {
    out.push(fact("My pick: none recorded."));
  } else if (ps.pick.current === null) {
    out.push(fact("My pick: no view."));
  } else {
    const place = ownPickPlace(card, ps.pick.current);
    out.push(fact("My pick: " + pickText(ps.pick.current, NAMES) + " - " + (place.rank === null ? "not ranked" : "ranked #" + place.rank + " (value " + f4(place.value) + ")") + " at the reference arm."));
  }
  if (pickAnswered(ps) && ps.pick.blind !== undefined && !samePick(ps.pick.blind, ps.pick.current)) {
    out.push(fact("Given blind: " + pickText(ps.pick.blind, NAMES) + "."));
  }
  if (card.actual_next && card.actual_next.length > 0) {
    out.push(fact("Played next: " + card.actual_next.map(DN).join(" + ") + "."));
  }
  return out;
}

function revealRow(draft, card, rv, idx) {
  const cur = currentLabel(state, card.id, rv.id);
  const r = el("div", "o rv" + (cur ? " labelled" : "") + (rv.nearTie ? " near" : "") + (rv.controls ? "" : " ro"));
  if (rv.controls) {
    r.tabIndex = 0;
    r.dataset.card = card.id;
    r.dataset.idx = String(idx);
  }
  const who = el("div", "who2");
  const ics = el("div", "ics");
  for (const c of rv.option.action) ics.appendChild(icon(c));
  who.appendChild(ics);
  const words = el("div", "words", rv.sideText);
  if (rv.rank !== null) words.appendChild(badge("#" + rv.rank, ""));
  if (rv.nearTie) words.appendChild(badge("near tie with #1", "tie"));
  if (rv.bestInPool) words.appendChild(badge("best in pool", "bip"));
  if (rv.rowKind === "later") words.appendChild(badge("ranks 6-10: label now", "late"));
  if (rv.rank === null) words.appendChild(badge("not ranked at this arm", ""));
  who.appendChild(words);
  r.appendChild(who);
  if (rv.controls) r.appendChild(segFor(draft, card, rv.option, idx, rv.sideText));
  const meta = el("div", "meta");
  if (rv.rank !== null) {
    meta.appendChild(el("span", "", "value " + f4(rv.value)));
    meta.appendChild(el("span", "", "gain " + f3(rv.gainLogit) + " logit (" + f2(rv.gainPp) + " pp)"));
    meta.appendChild(el("span", "", rv.cls + " - off-pool picks " + rv.dOff + ", grade " + rv.dGrade));
  }
  if (rv.line) meta.appendChild(el("span", "", "line: " + rv.line));
  for (const s of rv.steps) meta.appendChild(el("span", "", s));
  if (rv.ends) meta.appendChild(el("span", "", rv.ends));
  r.appendChild(meta);
  return r;
}

function lineBlock(draft, card) {
  const top = referenceTop(DATA, card);
  if (!top) return null;
  const box = el("div", "lineverdict");
  box.appendChild(el("p", "lbl", "Line of the reference #1"));
  box.appendChild(el("div", "words", rowView(top.option, NAMES).text));
  if (top.line === null) {
    box.appendChild(el("p", "note", "No line at this slot: nothing to judge."));
    return box;
  }
  box.appendChild(el("div", "note", "line: " + top.line));
  for (const s of top.steps) box.appendChild(el("div", "note", stepText(s, NAMES)));
  const ps = state.positions[card.id];
  const seg = el("div", "seg");
  seg.setAttribute("role", "group");
  seg.setAttribute("aria-label", "Does the continuation read like a draft?");
  for (const [text, ok] of [["ok", true], ["bad", false]]) {
    const b = el("button", "", text);
    b.type = "button";
    b.setAttribute("aria-pressed", String(currentLineVerdict(card, ps, top) === ok));
    b.onclick = () => changed(() => setLineVerdict(state, DATA, draft, card.id, ok, now()), card.id);
    seg.appendChild(b);
  }
  box.appendChild(el("p", "note", "Does the continuation read like a draft?"));
  box.appendChild(seg);
  return box;
}

function menuBlock(card) {
  const d = el("details", "more");
  d.appendChild(el("summary", "", "Pool menu at the reference arm"));
  for (const m of menuView(card, NAMES)) {
    const t = el("table", "");
    const head = el("tr", "");
    head.appendChild(el("th", "", m.role));
    head.appendChild(el("th", "", "rank"));
    head.appendChild(el("th", "", "gain"));
    t.appendChild(head);
    for (const it of m.items) {
      const tr = el("tr", "");
      tr.appendChild(el("td", "", it.champion + (it.status === "open" ? "" : " (" + it.status + ")")));
      tr.appendChild(el("td", "", it.rank === null ? "-" : "#" + it.rank));
      tr.appendChild(el("td", "", it.rank === null ? "-" : f3(it.gainLogit) + " logit (" + f2(it.gainPp) + " pp)"));
      t.appendChild(tr);
    }
    d.appendChild(t);
  }
  return d;
}

function earlierBlock(card) {
  const d = el("details", "more");
  d.appendChild(el("summary", "", "Earlier verdicts and the review"));
  const view = earlierView(card, NAMES);
  d.appendChild(fact(view.legacy));
  d.appendChild(fact(view.review));
  d.appendChild(fact("Graded history in the fixture: " + (view.entries.length === 0 ? "none." : view.entries.length + " earlier entr" + (view.entries.length === 1 ? "y:" : "ies:"))));
  for (const line of view.entries) d.appendChild(fact(line, "note"));
  if (card.notes) d.appendChild(fact("Fixture notes: " + card.notes));
  return d;
}

function revealStage(draft, card) {
  const wrap = el("div", "stage");
  const ps = state.positions[card.id];
  const arm = DATA.run.arms[viewArm];
  wrap.appendChild(el("p", "lbl", "3. Revealed - " + armLabel(arm, DATA.run.reference_arm)));
  const facts = el("div", "facts");
  const depth = depthNote(card, NAMES);
  if (depth) facts.appendChild(fact(depth, "warn"));
  for (const f of ownPickFacts(card, ps)) facts.appendChild(f);
  for (const w of card.warnings) facts.appendChild(fact("Loader warning: " + w, "warn"));
  wrap.appendChild(facts);
  const view = revealRows(DATA, card, viewArm);
  const labelled = [];
  if (view.note) wrap.appendChild(el("p", "note", view.note));
  const box = el("div", "opts");
  view.rows.forEach((rv) => {
    const idx = rv.controls ? labelled.length : -1;
    if (rv.controls) labelled.push(rv.option);
    box.appendChild(revealRow(draft, card, rv, idx));
  });
  ROWLIST.set(card.id, labelled);
  wrap.appendChild(box);
  wrap.appendChild(el("p", "note", "A label or pick changed now is recorded as scored. Rows within " + DATA.run.margin + " logit of #1 are marked as a near tie. Gain is over this arm's best in-pool option."));
  const lb = lineBlock(draft, card);
  if (lb) wrap.appendChild(lb);
  wrap.appendChild(menuBlock(card));
  wrap.appendChild(earlierBlock(card));
  return wrap;
}

function noteBlock(draft, card) {
  const wrap = el("div", "stage");
  wrap.appendChild(el("p", "lbl", "Note on this position"));
  const ta = el("textarea", "cardnote");
  ta.value = currentNote(card, state.positions[card.id]);
  ta.setAttribute("aria-label", "Note on " + card.id);
  // The card is not rebuilt: the change fires on blur, often because a label button was pressed, and replacing
  // the card then would swallow that click.
  ta.addEventListener("change", () => changed(() => setNote(state, draft, card.id, ta.value, now()), card.id, false));
  wrap.appendChild(ta);
  return wrap;
}

function buildCard(draft, card, hideDone) {
  const mc = card.mover.toLowerCase();
  const done = cardDone(card, state);
  const settled = cardSettled(draft, card, state);
  const c = el("div", "card " + mc + (done ? " done" : ""));
  c.id = "c-" + card.id;
  const h = el("div", "chead");
  h.appendChild(el("h3", "", card.id));
  h.appendChild(el("span", "mover " + mc, card.mover + " moves - " + slotText(card) + " - open: " + card.open_roles.map((set) => set.join(" + ")).join(" or ")));
  c.appendChild(h);
  const bw = el("div", "boards");
  bw.appendChild(boardSide(card, "Blue"));
  bw.appendChild(boardSide(card, "Red"));
  c.appendChild(bw);
  c.appendChild(poolBlock(card));
  c.appendChild(stageOne(draft, card));
  if (draftShown(draft, state)) {
    c.appendChild(revealStage(draft, card));
    c.appendChild(noteBlock(draft, card));
  } else {
    const rows = cardRows(draft, card, state);
    if (rows.length > 0) {
      c.appendChild(stageTwo(draft, card, rows));
      c.appendChild(noteBlock(draft, card));
    } else {
      ROWLIST.set(card.id, []);
    }
  }
  // The filter applies when it is toggled and on load, never to a card the reader is still working in.
  c.hidden = hideDone && settled;
  return c;
}
function draftHead(draft) {
  const done = draft.cards.filter((c) => cardDone(c, state)).length;
  const h = el("div", "dhead");
  h.appendChild(el("h2", "", draft.title + (draftSealed(draft) ? " (sealed)" : "")));
  h.appendChild(el("span", "dprog", done + " of " + draft.cards.length + " cards done"));
  return h;
}
function draftFoot(draft) {
  const f = el("div", "dfoot");
  const rs = draftRevealState(draft, state);
  const left = draft.cards.reduce((n, c) => n + blindRows(c).filter((o) => state.positions[c.id].labels[o.id] === undefined).length, 0);
  if (draftSealed(draft)) {
    f.appendChild(el("span", "", "No reveal in this run: the holdout is sealed. " + left + " blind row" + (left === 1 ? "" : "s") + " left. It opens only with --open-holdout, which is recorded."));
    return f;
  }
  const msg = rs === "revealed" ? "Revealed. Labels and picks changed now are recorded as scored." : rs === "ready" ? "Every blind row of this draft is labelled. The reveal is one way." : left + " blind row" + (left === 1 ? "" : "s") + " left in this draft.";
  f.appendChild(el("span", "", msg));
  const b = el("button", "btn", "Reveal the " + draft.title.replace(/ draft$/, "") + " draft");
  b.type = "button";
  b.disabled = rs !== "ready";
  b.title = rs === "ready" ? "Show the engine's scores for every card of this draft." : rs === "revealed" ? "Already revealed." : "Label every blind row of this draft first.";
  b.onclick = () => {
    let did = false;
    try { did = revealDraft(state, draft, now()); } catch (e) { console.error(e); return; }
    if (did) { persist(); render(); }
  };
  f.appendChild(b);
  return f;
}
function updateHeader() {
  const p = progress(DATA, state);
  const anyRevealed = DATA.drafts.some((d) => draftShown(d, state));
  const later = laterProgress(DATA, state);
  document.getElementById("count-rows").textContent = p.blindDone + " / " + p.blindTotal + " blind" + (anyRevealed ? " - " + later.done + " / " + later.total + " later" : "");
  document.getElementById("count-cards").textContent = p.cardsDone + " / " + p.cardsTotal + " cards";
  document.getElementById("armwrap").hidden = !anyRevealed;
  const has = state.rev > 0;
  for (const id of ["copy", "download"]) {
    const b = document.getElementById(id);
    b.disabled = !has;
    b.title = has ? "The page's whole state at rev " + state.rev + "; the newest export replaces the older ones." : "Nothing to export yet.";
  }
}
const EL = new Map();
function refresh(cardId) {
  const { draft, card } = CARDS.get(cardId);
  const e = EL.get(cardId);
  const fresh = buildCard(draft, card);
  e.card.replaceWith(fresh);
  e.card = fresh;
  const d = EL.get("draft:" + draft.id);
  const head = draftHead(draft);
  d.head.replaceWith(head);
  d.head = head;
  const foot = draftFoot(draft);
  d.foot.replaceWith(foot);
  d.foot = foot;
  updateHeader();
}
// Run a state change; persist and redraw only when it recorded something.
function changed(fn, cardId, rebuild = true) {
  let did = false;
  try { did = fn(); } catch (e) { console.error(e); return; }
  if (did) { persist(); if (rebuild) refresh(cardId); else updateHeader(); }
}
function render() {
  const root = document.getElementById("root");
  root.innerHTML = "";
  const list = document.createElement("datalist");
  list.id = "roster";
  for (const id of Object.keys(NAMES).sort((a, b) => (DN(a) < DN(b) ? -1 : DN(a) > DN(b) ? 1 : 0))) {
    const o = document.createElement("option");
    o.value = DN(id);
    list.appendChild(o);
  }
  root.appendChild(list);
  for (const draft of DATA.drafts) {
    const s = el("section", "draft");
    const head = draftHead(draft);
    s.appendChild(head);
    const cs = el("div", "cards");
    for (const card of draft.cards) {
      const ce = buildCard(draft, card, document.getElementById("unfinished").checked);
      EL.set(card.id, { card: ce });
      cs.appendChild(ce);
    }
    s.appendChild(cs);
    const foot = draftFoot(draft);
    s.appendChild(foot);
    EL.set("draft:" + draft.id, { head, foot });
    root.appendChild(s);
  }
  updateHeader();
}

// ---- keys 1 / 2 / 3 label the focused row and advance ----
document.addEventListener("keydown", (ev) => {
  const lab = KEY_LABEL[ev.key];
  if (!lab || ev.ctrlKey || ev.metaKey || ev.altKey) return;
  const t = ev.target;
  if (t instanceof HTMLInputElement || t instanceof HTMLTextAreaElement) return;
  const row = t instanceof Element ? t.closest(".o") : null;
  if (!row || !row.dataset.card) return;
  const { draft, card } = CARDS.get(row.dataset.card);
  const idx = Number(row.dataset.idx);
  const option = (ROWLIST.get(card.id) || [])[idx];
  if (!option) return;
  ev.preventDefault();
  labelRow(draft, card, option, lab, idx, true);
});

// ---- the arm selector, and the export ----
(function armSelect() {
  const sel = document.getElementById("arm");
  DATA.run.arms.forEach((a, i) => {
    const o = el("option", "", armLabel(a, DATA.run.reference_arm));
    o.value = String(i);
    sel.appendChild(o);
  });
  sel.value = String(viewArm);
  sel.addEventListener("change", () => {
    viewArm = Number(sel.value);
    armsDirty = false;
    render();
    if (!document.getElementById("results").hidden) renderResults();
  });
})();

function setExportMessage(text) {
  document.getElementById("export-msg").textContent = text;
}
// The whole state at the current rev. Problems (an own pick the loader would refuse) are shown, never exported.
function currentExport() {
  try {
    const { exported, problems } = exportWithProblems(state, DATA);
    return { text: JSON.stringify(exported, null, 2) + "\n", problems, rev: exported.rev };
  } catch (e) {
    setExportMessage("Export failed: " + e.message);
    return null;
  }
}
function problemSuffix(problems) {
  return problems.length === 0 ? "" : " Left out: " + problems.join(" | ");
}
function showBox(text) {
  const box = document.getElementById("export-box");
  box.hidden = false;
  box.value = text;
  if (box.select) box.select();
  return box;
}
document.getElementById("copy").addEventListener("click", () => {
  const ex = currentExport();
  if (!ex) return;
  const ok = () => setExportMessage("Copied rev " + ex.rev + "." + problemSuffix(ex.problems));
  const manual = () => {
    showBox(ex.text);
    let copied = false;
    try { copied = document.execCommand("copy"); } catch (e) { copied = false; }
    setExportMessage(copied ? "Copied rev " + ex.rev + "." + problemSuffix(ex.problems) : "The browser blocked copying: the text is selected below; copy it, or use Download." + problemSuffix(ex.problems));
  };
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(ex.text).then(ok, manual);
    else manual();
  } catch (e) {
    manual();
  }
});
document.getElementById("download").addEventListener("click", () => {
  const ex = currentExport();
  if (!ex) return;
  try {
    const url = URL.createObjectURL(new Blob([ex.text], { type: "application/json" }));
    const a = document.createElement("a");
    a.href = url;
    a.download = "tier-b-verdicts-" + DATA.run.id.replace(/:/g, "") + "-rev" + ex.rev + ".json";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
    setExportMessage("Downloaded rev " + ex.rev + "." + problemSuffix(ex.problems));
  } catch (e) {
    showBox(ex.text);
    setExportMessage("The download failed: the text is shown below." + problemSuffix(ex.problems));
  }
});
document.getElementById("unfinished").addEventListener("change", () => {
  for (const [id, { card }] of EL) if (!id.startsWith("draft:")) card.hidden = cardSettled(CARDS.get(id).draft, CARDS.get(id).card, state) && document.getElementById("unfinished").checked;
});

// ---- the results tab (design section 5) ----
// Corpus-wide aggregates from the run's `metrics`. It reads `state` only through `positionVisible`, which names
// a position only when its draft is revealed, and it writes nothing to `state`: reading the tab or selecting an
// arm from it cannot reveal a draft, and no per-option engine rank of an unrevealed draft is on it.
const visiblePos = (id) => positionVisible(DATA, state, id);
let detailEl = null; // the detail block under the table
let CELLS = []; // the selectable cells, for the pressed state
let armsDirty = false; // an arm was chosen on the tab: the cards are redrawn when the Positions tab is shown
const tipEl = document.getElementById("tip");

function showTip(texts, anchor) {
  tipEl.innerHTML = "";
  for (const l of texts) tipEl.appendChild(el("div", "ln", l));
  tipEl.hidden = false;
  if (anchor && typeof anchor.getBoundingClientRect === "function") {
    const r = anchor.getBoundingClientRect();
    const h = tipEl.getBoundingClientRect().height || 0; // measured, not assumed
    const top = r.bottom + 6 + h > window.innerHeight ? Math.max(8, r.top - 6 - h) : r.bottom + 6;
    tipEl.style.top = top + "px";
    tipEl.style.left = Math.max(8, Math.min(r.left, window.innerWidth - 420)) + "px";
  }

// The same lines, always on the page under the table (the tooltip enhances, it does not gate): the focused,
// else the selected, arm.
function showDetail(texts) {
  const d = detailEl;
  if (!d) return;
  d.innerHTML = "";
  for (const l of texts) d.appendChild(el("div", "ln", l));
}
function hideTip() {
  tipEl.hidden = true;
}
// A mark with hover and keyboard-focus details; the same lines are in the detail block under the table.
function withTip(node, lines) {
  node.tabIndex = 0;
  node.setAttribute("aria-describedby", "tip");
  node.addEventListener("pointerenter", () => showTip(lines, node));
  node.addEventListener("pointerleave", hideTip);
  node.addEventListener("focus", () => { showTip(lines, node); showDetail(lines); });
  node.addEventListener("blur", hideTip);
  node.addEventListener("keydown", (ev) => { if (ev.key === "Escape") hideTip(); });
}
function rsec(title) {
  const s = el("div", "rsec");
  s.appendChild(el("h2", "", title));
  return s;
}
function lines(sec, list, cls) {
  for (const l of list) sec.appendChild(el("p", "ln " + (cls || ""), l));
}

function armByIdIn(id) {
  return DATA.metrics.arms.find((a) => a.id === id);
}

function heatCell(model, selectable) {
  const arm = armByIdIn(model.id);
  const tip = hoverLines(arm, visiblePos);
  const b = el(selectable ? "button" : "div", "hc h" + model.step + (selectable ? "" : " static"));
  if (selectable) b.type = "button";
  b.dataset.arm = model.id;
  b.appendChild(el("span", "n", model.text));
  const tg = el("span", "tg");
  for (const t of model.tags) tg.appendChild(el("span", "", t));
  b.appendChild(tg);
  b.setAttribute("aria-label", model.id + ": never@1 " + model.text + (model.tags.length ? ". " + model.tags.join(", ") : ""));
  if (selectable) {
    const idx = armChoice(DATA, model.id);
    b.setAttribute("aria-pressed", String(idx === viewArm));
    CELLS.push(b);
    b.addEventListener("click", () => {
      if (idx < 0) return;
      viewArm = idx;
      document.getElementById("arm").value = String(idx);
      armsDirty = true;
      for (const c of CELLS) c.setAttribute("aria-pressed", String(c.dataset.arm === model.id));
      document.getElementById("selnote").textContent = selectionNote(DATA, state, idx);
      showDetail(tip);
    });
    b.addEventListener("pointerenter", () => showTip(tip, b));
    b.addEventListener("pointerleave", hideTip);
    b.setAttribute("aria-describedby", "tip");
    b.addEventListener("focus", () => { showTip(tip, b); showDetail(tip); });
    b.addEventListener("blur", hideTip);
    b.addEventListener("keydown", (ev) => { if (ev.key === "Escape") hideTip(); });
  } else {
    withTip(b, tip);
  }
  return b;
}

function renderResults() {
  const root = document.getElementById("results");
  root.innerHTML = "";
  CELLS = [];
  hideTip();
  const M = DATA.metrics;
  if (!M) {
    const s = rsec("Results");
    s.appendChild(el("p", "", "No labels yet: this run has no results to read. Label some positions, apply the export, and run again."));
    root.appendChild(s);
    return;
  }
  const g = gridModel(M);
  // 1. the table
  const t = rsec("never@1 by P and Q");
  t.appendChild(el("p", "note", "Each cell: positions where the engine's #1 is a clear never (≥n: n is a lower bound, some options unjudged; (+n): near ties, not read by the rule). Hover or focus a cell for never@3, pick@3 and the positions behind each count; Enter or click selects the arm for the cards. " + labelsLine(M.labels)));
  const side = el("div", "rside");
  const grid = el("div", "");
  const tbl = el("table", "heat");
  const head = el("tr", "");
  head.appendChild(el("th", "", "P \\ Q"));
  for (const q of g.qs) { const th = el("th", "", "Q " + q); th.setAttribute("scope", "col"); head.appendChild(th); }
  tbl.appendChild(head);
  g.ps.forEach((p, i) => {
    const tr = el("tr", "");
    const th = el("th", "", "P " + p);
    th.setAttribute("scope", "row");
    tr.appendChild(th);
    for (const c of g.rows[i]) {
      const td = el("td", "");
      if (c) td.appendChild(heatCell(c, true));
      else td.appendChild(el("span", "note", "-"));
      tr.appendChild(td);
    }
    tbl.appendChild(tr);
  });
  const scroll = el("div", "hscroll");
  scroll.appendChild(tbl);
  grid.appendChild(scroll);
  const key = el("div", "heatkey");
  for (const b of heatLegend(g.max)) {
    key.appendChild(el("i", "h" + b.step));
    key.appendChild(el("span", "", b.text));
  }
  key.appendChild(el("span", "", "never@1 positions (largest on the grid: " + g.max + ")"));
  grid.appendChild(key);
  side.appendChild(grid);
  const beside = el("div", "");
  beside.appendChild(el("p", "lbl", "Beside the grid: not selectable as the pick"));
  if (g.por) {
    beside.appendChild(el("p", "note", "pool_or_roster"));
    beside.appendChild(heatCell({ ...g.por, tags: ["not selectable as the pick", ...g.por.tags] }, false));
  }
  const ft = el("table", "fl");
  const fh = el("tr", "");
  for (const h of ["floor row", "never@1", "never@3", "pick@3", "does not speak", "unknown r kept"]) fh.appendChild(el("th", "", h));
  ft.appendChild(fh);
  for (const f of g.floors) {
    const tr = el("tr", "");
    for (const v of [f.id, f.text, f.never3, String(f.pick3), f.nonSpeaking + " of " + f.positions, String(f.unknownR)]) tr.appendChild(el("td", "", v));
    withTip(tr, hoverLines(armByIdIn(f.id), visiblePos));
    ft.appendChild(tr);
  }
  beside.appendChild(el("p", "note", "Floor rows: the reference ranking with options holding an off-pool placement below r 0.10 and 0.25 removed (root only, no re-search)."));
  beside.appendChild(ft);
  side.appendChild(beside);
  t.appendChild(side);
  const ub = upperBoundLines(M);
  if (ub.length > 0) {
    t.appendChild(el("p", "lbl", "Upper bounds for the ≥ cells (never + unjudged, at k = 1 / k = 3)"));
    lines(t, ub, "note");
  }
  t.appendChild(el("p", "note", "Cards show the arm chosen here and only on revealed drafts."));
  const sel = el("p", "ln", selectionNote(DATA, state, viewArm));
  sel.id = "selnote";
  t.appendChild(sel);
  t.appendChild(el("p", "lbl", "Detail of the selected or focused arm"));
  const det = el("div", "detail");
  det.id = "detail";
  detailEl = det;
  t.appendChild(det);
  const shownArm = armByIdIn(DATA.run.arms[viewArm].id) || armByIdIn(M.rule.pick || M.reference);
  if (shownArm) showDetail(hoverLines(shownArm, visiblePos));
  root.appendChild(t);

  // 2. the rule, receipt, sensitivity, second line
  const r = rsec("The rule");
  lines(r, [ruleLine(M.rule)]);
  for (const e of M.rule.edge) lines(r, [e.text]);
  if (M.rule.receipt) {
    r.appendChild(el("p", "lbl", "Receipt, " + M.rule.receipt.reference + " → " + M.rule.receipt.pick));
    lines(r, receiptLines(M.rule.receipt, visiblePos));
  }
  r.appendChild(el("p", "lbl", "Sensitivity (the pick at other margins, and with each draft left out)"));
  lines(r, sensitivityLines(M.sensitivity));
  r.appendChild(el("p", "lbl", "Second line (the rule on the current fold)"));
  lines(r, [secondLine(M.second_line)]);
  root.appendChild(r);

  // 3. the rest
  const o = rsec("Also");
  o.appendChild(el("p", "lbl", "bad_line@1 (bad of judged; an unjudged line is not a good one)"));
  lines(o, badLineLines(M));
  o.appendChild(el("p", "lbl", "never_everywhere (a clear never at #1 at every readable arm)"));
  lines(o, [neverEverywhereLine(M.never_everywhere, visiblePos)]);
  o.appendChild(el("p", "lbl", "r_by_label (options with one off-pool placement)"));
  const rt = el("table", "rtable");
  const rh = el("tr", "");
  for (const h of ["r", "play", "maybe", "never"]) rh.appendChild(el("th", "", h));
  rt.appendChild(rh);
  for (const row of rByLabelRows(M.r_by_label)) {
    const tr = el("tr", "");
    for (const v of [row.bucket, row.play, row.maybe, row.never]) tr.appendChild(el("td", "", String(v)));
    rt.appendChild(tr);
  }
  o.appendChild(rt);
  o.appendChild(el("p", "lbl", "reveal_changes"));
  lines(o, [revealChangesLine(M.reveal_changes)]);
  const rcv = revealChangesView(M.reveal_changes, visiblePos);
  for (const c of rcv.labels) lines(o, [c.position + ": " + c.option + " " + c.blind + " → " + c.current], "note");
  for (const c of rcv.picks) lines(o, [c.position + ": own pick " + JSON.stringify(c.blind) + " → " + JSON.stringify(c.current)], "note");
  root.appendChild(o);

  const w = worklistView(M.worklist, visiblePos);
  const wl = rsec("Worklist");
  lines(wl, [(M.rule.readable === 0 ? "No arm is readable: this is what is left to judge. " : "") + "Unlabelled rows are listed for revealed drafts only" + (w.hiddenRows > 0 ? "; " + w.hiddenRows + " more in drafts not yet revealed (not listed)" : "") + "."]);
  for (const e of w.unlabelled) lines(wl, [e.position + ": " + e.rows.length + " unlabelled rows - " + e.rows.join(" | ")], "note");
  lines(wl, [linesHeader(w) + (w.hiddenLines > 0 ? ". " + w.hiddenLines + " in drafts not yet revealed (not named)" : "")]);
  for (const l of w.unjudgedLines) lines(wl, [l.position + ": " + l.option + " - " + l.line + (l.judgeable === false ? NOT_JUDGEABLE : "")], "note");
  root.appendChild(wl);
}

function showTab(which) {
  const positions = which === "positions";
  document.getElementById("root").hidden = !positions;
  document.getElementById("results").hidden = positions;
  document.getElementById("tab-positions").setAttribute("aria-selected", String(positions));
  document.getElementById("tab-results").setAttribute("aria-selected", String(!positions));
  hideTip();
  if (positions) {
    if (armsDirty) { armsDirty = false; render(); }
  } else {
    renderResults();
  }
}
document.getElementById("tab-positions").addEventListener("click", () => showTab("positions"));
document.getElementById("tab-results").addEventListener("click", () => showTab("results"));

document.getElementById("runline").textContent =
  "run " + DATA.run.id + " - " + DATA.run.engine.name + " " + (DATA.run.engine.commit || "?") + " - positions patch " + DATA.run.data.positions_patch;
showNotice();
render();
document.body.dataset.loadMs = String(Math.round(performance.now() - T0));
</script>
</body>
</html>
